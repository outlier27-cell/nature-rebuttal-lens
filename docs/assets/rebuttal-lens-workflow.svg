<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Nature RebuttalLens workflow</title>
  <desc id="desc">A 12-agent manuscript-aware workflow from reviewer comment and manuscript context to traceable rebuttal planning, cross-disciplinary interpretation, and integrity checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef7f4"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .agent { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .agentSub { font: 500 12px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .footerTitle { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .footerText { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .box { rx: 14; stroke-width: 1.3; filter: url(#shadow); }
      .softLine { stroke: #cbd5e1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .rail { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 7; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="url(#bg)"/>
  <rect x="40" y="36" width="1200" height="828" rx="28" fill="#ffffff" stroke="#dbe3ea"/>

  <text x="78" y="102" class="title">Nature RebuttalLens</text>
  <rect x="78" y="122" width="310" height="6" rx="3" fill="url(#titleGrad)"/>
  <text x="78" y="160" class="subtitle">Manuscript-aware, cross-disciplinary Author Rebuttal Assistant over Nature transparent peer-review cases.</text>
  <text x="78" y="188" class="small">Output: traceable planning artifacts, not a submission-ready final rebuttal.</text>

  <rect x="78" y="230" width="260" height="500" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="102" y="264" class="section">Inputs</text>
  <text x="102" y="302" class="small">Reviewer comment</text>
  <text x="102" y="334" class="small">Manuscript text / Markdown</text>
  <text x="102" y="366" class="small">Optional draft response</text>
  <text x="102" y="398" class="small">Optional editor letter</text>
  <text x="102" y="430" class="small">Optional Nature cases</text>
  <line x1="102" y1="466" x2="314" y2="466" stroke="#bfdbfe"/>
  <text x="102" y="502" class="section">Hard boundaries</text>
  <text x="102" y="540" class="small">No fabricated evidence</text>
  <text x="102" y="572" class="small">No acceptance prediction</text>
  <text x="102" y="604" class="small">No hidden-intent claims</text>
  <text x="102" y="636" class="small">Author confirmation required</text>
  <text x="102" y="668" class="small">Confidential upload warning</text>

  <path d="M348 480 C390 480 392 480 424 480" class="softLine"/>

  <rect x="424" y="230" width="778" height="500" rx="24" fill="#f8fafc" stroke="#d8e1ea"/>
  <text x="456" y="264" class="section">12-agent workflow</text>
  <text x="456" y="290" class="tiny">Each block is a model-assisted reasoning unit with provenance in the trace.</text>

  <rect x="456" y="320" width="210" height="80" class="box" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="476" y="348" class="agent">1. Manuscript Context</text>
  <text x="476" y="374" class="agentSub">sections, limits, usable context</text>

  <rect x="708" y="320" width="210" height="80" class="box" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="728" y="348" class="agent">2. Review Understanding</text>
  <text x="728" y="374" class="agentSub">atomic concerns, severity</text>

  <rect x="960" y="320" width="210" height="80" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="980" y="348" class="agent">3. Tacit Concern</text>
  <text x="980" y="374" class="agentSub">observable implicit risks</text>

  <rect x="456" y="440" width="210" height="80" class="box" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="476" y="468" class="agent">4. Evidence Locator</text>
  <text x="476" y="494" class="agentSub">supported / partial / missing</text>

  <rect x="708" y="440" width="210" height="80" class="box" fill="#fefce8" stroke="#fde047"/>
  <text x="728" y="468" class="agent">5. Institutional Signal</text>
  <text x="728" y="494" class="agentSub">editor-readable pressure</text>

  <rect x="960" y="440" width="210" height="80" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="980" y="468" class="agent">6. Case Interpreter</text>
  <text x="980" y="494" class="agentSub">bounded Nature analogies</text>

  <rect x="456" y="560" width="210" height="80" class="box" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="476" y="588" class="agent">7. Evidence Planner</text>
  <text x="476" y="614" class="agentSub">actions, artifacts, questions</text>

  <rect x="708" y="560" width="210" height="80" class="box" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="728" y="588" class="agent">8. Author Positioning</text>
  <text x="728" y="614" class="agentSub">stance without forced concession</text>

  <rect x="960" y="560" width="210" height="80" class="box" fill="#fff1f2" stroke="#fda4af"/>
  <text x="980" y="588" class="agent">9. Tone Calibration</text>
  <text x="980" y="614" class="agentSub">defensiveness, overclaim risk</text>

  <rect x="456" y="680" width="210" height="80" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="476" y="708" class="agent">10. Actor Network</text>
  <text x="476" y="734" class="agentSub">figures, data, code, supplements</text>

  <rect x="708" y="680" width="210" height="80" class="box" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="728" y="708" class="agent">11. Cross-Disciplinary Lens</text>
  <text x="728" y="734" class="agentSub">tacit knowledge, agency, norms</text>

  <rect x="960" y="680" width="210" height="80" class="box" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="980" y="708" class="agent">12. Integrity Gate</text>
  <text x="980" y="734" class="agentSub">adequacy, provenance, warnings</text>

  <path d="M666 360 H700" class="softLine"/>
  <path d="M918 360 H952" class="softLine"/>
  <path d="M1065 400 V430" class="softLine"/>
  <path d="M960 480 H926" class="softLine"/>
  <path d="M708 480 H674" class="softLine"/>
  <path d="M561 520 V550" class="softLine"/>
  <path d="M666 600 H700" class="softLine"/>
  <path d="M918 600 H952" class="softLine"/>
  <path d="M1065 640 V670" class="softLine"/>
  <path d="M960 720 H926" class="softLine"/>
  <path d="M708 720 H674" class="softLine"/>

  <path d="M455 785 H1170" class="rail"/>
  <text x="456" y="816" class="tiny">Trace includes inputs, agent outputs, case boundaries, evidence gaps, author-confirmation questions, and safety warnings.</text>

  <rect x="78" y="760" width="1124" height="70" rx="16" fill="#0f172a"/>
  <text x="104" y="792" class="footerTitle">Release-safe outputs</text>
  <text x="104" y="816" class="footerText">rebuttal_lens_trace.json  ·  rebuttal_lens_summary.json  ·  validation reports  ·  responsible-use documentation</text>
</svg>
